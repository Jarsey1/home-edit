name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy staging
    if: ${{ vars.STAGING_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set build timestamp
        run: echo "NEXT_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Lint, typecheck, test and build
        run: npm run build:cloudflare:checked
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_ENV: staging
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}

      - name: Deploy staging Worker
        run: |
          npx wrangler deploy --config wrangler.staging.jsonc \
            --var "NEXT_PUBLIC_SUPABASE_URL:${{ vars.STAGING_SUPABASE_URL }}" \
            --var "NEXT_PUBLIC_SUPABASE_ANON_KEY:${{ vars.STAGING_SUPABASE_ANON_KEY }}" \
            --var "NEXT_PUBLIC_APP_ENV:staging"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
